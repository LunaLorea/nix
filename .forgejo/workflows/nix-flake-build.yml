name: Build all systems
on:
  push:
    paths:
      - "**/flake.lock"
  # Nightly build at 4 AM
  workflow_dispatch:

jobs:
  build:
    runs-on: alpine-latest
    steps:
      - name: Install Lix
        uses: https://git.gradient.moe/actions/install-lix@v1
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Private Attic Cache
        uses: actions/setup-attic-cache@v1
        with:
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Run Build Desktop
        id: build0
        run: nix build --substituters 'https://cache.nixos.org/ https://cache.lorea.dev/myriorama https://nix-community.cachix.org https://cache.forall.systems' --trusted-public-keys 'nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= myriorama:xpV92HJL80tJtom5W++emPbRCv7Vh6fChZ+AUDpeH/o= cache.forall.systems:5PmD7QO4MSF8YgyRZtkSGXRDo96H3bybIf2SsQh8ScI= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=' .#nixosConfigurations.desktop.config.system.build.toplevel
        continue-on-error: true
      - name: Run Build Myriorama
        id: build1
        run:  nix build --substituters 'https://cache.nixos.org/ https://cache.lorea.dev/myriorama https://nix-community.cachix.org https://cache.forall.systems' --trusted-public-keys 'nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= myriorama:xpV92HJL80tJtom5W++emPbRCv7Vh6fChZ+AUDpeH/o= cache.forall.systems:5PmD7QO4MSF8YgyRZtkSGXRDo96H3bybIf2SsQh8ScI= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=' .#nixosConfigurations.myriorama.config.system.build.toplevel
        continue-on-error: true
      - name: Run Build Epitome
        id: build2
        run: nix build --substituters 'https://cache.nixos.org/ https://cache.lorea.dev/myriorama https://nix-community.cachix.org https://cache.forall.systems' --trusted-public-keys 'nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= myriorama:xpV92HJL80tJtom5W++emPbRCv7Vh6fChZ+AUDpeH/o= cache.forall.systems:5PmD7QO4MSF8YgyRZtkSGXRDo96H3bybIf2SsQh8ScI= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=' .#nixosConfigurations.epitome.config.system.build.toplevel
        continue-on-error: true
      - name: Cache all store paths to Attic
        uses: actions/cache-to-attic@v1
        with:
          attic_cache: ${{ vars.ATTIC_CACHE }}
      - name: On failure
        if: ${{ steps.build0.outcome == 'failure' || steps.build1.outcome == 'failure' || steps.build2.outcome == 'failure' }}
        run: exit 1
