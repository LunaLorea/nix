name: "Setup Myriorama Attic Cache"
description: "Install and set up the Attic client with a cache."
inputs:
  attic-token:
    description: "The private token to log in with."
    required: true
outputs: {}
runs:
  using: composite
  steps:
    - name: "Install Attic Client"
      run: |
        echo "Installing Attic client..."
        nix profile install nixpkgs#attic-client --inputs-from $FORGEJO_WORKSPACE
    - name: "Log into Attic"
      run: |
        echo "Logging into Attic server..."
        attic login myriorama https://cache.lorea.dev ${{ inputs.attic-token }}
        echo "Logged in!"
    - name: "Use Attic Myriorama Cache"
      run: |
        echo "Enabling Myriorama cache..."
        attic use myriorama
        nohup attic watch-store myriorama &
        echo "Now using the Myriorama cache!"
